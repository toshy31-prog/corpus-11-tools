name: Final attestation runner

# Temporary bootstrap-only runner. Removed after the attested PASS.
on:
  push:
    branches:
      - agent/final-post-merge-attestation
    paths-ignore:
      - corpus-11-tools/docs/post-merge-reception-2026-08-19.md

permissions:
  contents: write

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run full reception and write attestation
        shell: bash
        run: |
          set -u -o pipefail
          REPORT=corpus-11-tools/docs/post-merge-reception-2026-08-19.md
          FAILED=0
          VALIDATED_HEAD=$(git rev-parse HEAD)

          cat > "$REPORT" <<EOF
          # Réception post-merge — 2026-08-19

          ## Périmètre attesté

          - base post-bootstrap : \`481856d399750eec017fa61897c98524bee29176\` ;
          - HEAD soumis à la réception intégrale : \`$VALIDATED_HEAD\` ;
          - runner : GitHub Actions / \`ubuntu-latest\` ;
          - génération UTC : \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`.

          Cette réception couvre l’état produit/recherche destiné à la clôture. Le seul fichier supplémentaire au-dessus de l’état final est le runner temporaire \`.github/workflows/final-attestation-runner.yml\`, supprimé après l’attestation.

          ## Matrice

          EOF

          run_check() {
            local name="$1"
            shift
            local logfile
            logfile="$(mktemp)"
            set +e
            "$@" 2>&1 | tee "$logfile"
            local code=${PIPESTATUS[0]}
            set -e
            if (( code == 0 )); then
              printf -- '- **%s** : PASS (`0`).\n' "$name" >> "$REPORT"
            else
              FAILED=1
              printf -- '- **%s** : FAIL (`%s`).\n\n```text\n' "$name" "$code" >> "$REPORT"
              tail -n 50 "$logfile" >> "$REPORT"
              printf '\n```\n\n' >> "$REPORT"
            fi
            rm -f "$logfile"
          }

          python -m pip install --disable-pip-version-check pytest

          run_check 'Paquet' bash -lc 'cd corpus-11-tools && python3 tools/validate_package.py'
          run_check 'Graphe' bash -lc 'cd corpus-11-tools && python3 tools/check_graph.py'
          run_check 'Documentation' bash -lc 'cd corpus-11-tools && python3 tools/check_docs.py'
          run_check 'Frontières produit/recherche' bash -lc 'cd corpus-11-tools && python3 tools/check_boundaries.py'
          run_check 'Tests Python' bash -lc 'PYTHONPATH=corpus-11-tools/labs/python pytest -q'
          run_check 'Tests Node hors prototype alimentaire archivé' bash -lc '
            mapfile -d "" tests < <(find corpus-11-tools research \
              -path "research/completed/food-access-paris/site" -prune -o \
              -type f \( -name "*.test.mjs" -o -name "*.test.js" -o -name "test-*.mjs" -o -name "test-*.js" \) -print0)
            if (( ${#tests[@]} == 0 )); then
              echo "No Node test modules found"
            else
              node --test "${tests[@]}"
            fi
          '
          run_check 'Contrôles CCT' bash -lc 'PYTHONPATH=corpus-11-tools/labs/python python3 research/active/cct/executable/run_all.py'
          run_check 'Prototype alimentaire terminé' bash -lc 'cd research/completed/food-access-paris/site && npm ci --ignore-scripts && npm test'
          run_check 'JSON/JSONL suivis' bash -lc '
            python3 - <<"PY"
          import json
          import subprocess
          from pathlib import Path
          paths = subprocess.check_output(["git", "ls-files", "*.json", "*.jsonl"], text=True).splitlines()
          for raw in paths:
              path = Path(raw)
              if path.suffix == ".json":
                  json.loads(path.read_text(encoding="utf-8"))
              else:
                  for line_no, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                      if line.strip():
                          try:
                              json.loads(line)
                          except Exception as exc:
                              raise RuntimeError(f"{path}:{line_no}: {exc}") from exc
          print(f"Validated {len(paths)} tracked JSON/JSONL files")
          PY
          '
          run_check 'Whitespace Git' git diff --check 481856d399750eec017fa61897c98524bee29176...HEAD

          if (( FAILED == 0 )); then
            cat >> "$REPORT" <<EOF

          ## Verdict final

          **PASS — réception post-merge intégrale réussie.**

          Aucun échec ne subsiste sur la matrice exécutée. Aucun résultat de recherche n’est promu par cette réception ; elle atteste l’intégrité du dépôt, de ses frontières et de ses suites de non-régression sur le HEAD indiqué.
          EOF
          else
            cat >> "$REPORT" <<EOF

          ## Verdict final

          **FAIL — au moins un contrôle de réception échoue.**
          EOF
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT"
          git commit -m 'Record final post-merge reception'
          git push origin HEAD:agent/final-post-merge-attestation

          exit "$FAILED"
