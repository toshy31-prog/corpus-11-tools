name: Finalize principle registry

on:
  push:
    branches: [hardening/total-validation]
    paths:
      - '.github/workflows/principle-registry-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: hardening/total-validation
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.11'
          pip-version: '26.2.1'
      - name: Generate exact registry
        working-directory: corpus-11-tools
        run: python3 tools/principle_registry.py > docs/principle-registry.json
      - name: Verify generated JSON
        working-directory: corpus-11-tools
        run: python3 -m json.tool docs/principle-registry.json >/dev/null
      - name: Commit registry only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corpus-11-tools/docs/principle-registry.json
          git diff --cached --quiet && exit 0
          git commit -m 'Attest canonical principle registry'
          git push origin HEAD:hardening/total-validation
