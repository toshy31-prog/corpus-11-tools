name: Finalize food lockfile

on:
  push:
    branches: [hardening/total-validation]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor == 'toshy31-prog'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: hardening/total-validation
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Generate lockfile from reviewed manifest
        working-directory: research/completed/food-access-paris/site
        run: npm install --package-lock-only --ignore-scripts
      - name: Prove exact lockfile
        working-directory: research/completed/food-access-paris/site
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npx --no-install drizzle-kit --version
          npm run lint
          npm test
      - name: Commit lockfile only
        run: |
          test -z "$(git diff --name-only -- research/completed/food-access-paris/site/package.json)"
          if git diff --quiet -- research/completed/food-access-paris/site/package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/completed/food-access-paris/site/package-lock.json
          git commit -m 'Lock remediated food dependencies'
          git push origin HEAD:hardening/total-validation
