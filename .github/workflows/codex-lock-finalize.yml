name: Finalize Codex CLI lock

on:
  push:
    branches: [hardening/total-validation]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor == 'toshy31-prog'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: hardening/total-validation
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Generate exact Codex lockfile
        working-directory: corpus-11-tools/tools/codex-cli-lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Prove locked Codex environment
        working-directory: corpus-11-tools/tools/codex-cli-lock
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          ./node_modules/.bin/codex --version | grep -F 'codex-cli 0.137.0'
      - name: Commit lockfile only
        run: |
          test -z "$(git diff --name-only -- corpus-11-tools/tools/codex-cli-lock/package.json)"
          if git diff --quiet -- corpus-11-tools/tools/codex-cli-lock/package-lock.json; then
            echo 'Codex lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corpus-11-tools/tools/codex-cli-lock/package-lock.json
          git commit -m 'Lock Codex CLI transitive dependencies'
          git push origin HEAD:hardening/total-validation
