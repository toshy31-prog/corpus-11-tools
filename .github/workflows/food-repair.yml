name: Food dependency repair

on:
  push:
    branches: [hardening/total-validation]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'toshy31-prog'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: hardening/total-validation
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Regenerate lockfile from fixed direct versions
        working-directory: research/completed/food-access-paris/site
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact \
            react@19.2.8 react-dom@19.2.8
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact \
            react-server-dom-webpack@19.2.8 \
            @cloudflare/vite-plugin@1.53.1 \
            vinext@1.0.0-beta.8 \
            vite@8.2.2 \
            wrangler@4.125.0
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Prove repaired dependency graph
        working-directory: research/completed/food-access-paris/site
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run lint
          npm test
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- research/completed/food-access-paris/site/package.json research/completed/food-access-paris/site/package-lock.json; then
            echo 'No dependency changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/completed/food-access-paris/site/package.json research/completed/food-access-paris/site/package-lock.json
          git commit -m 'Remediate food prototype dependency vulnerabilities'
          git push origin HEAD:hardening/total-validation
