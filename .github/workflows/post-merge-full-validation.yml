name: Post-merge full validation

on:
  push:
    branches:
      - agent/post-merge-full-validation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate package
        working-directory: corpus-11-tools
        run: python3 tools/validate_package.py

      - name: Validate graph
        working-directory: corpus-11-tools
        run: python3 tools/check_graph.py

      - name: Validate documentation
        working-directory: corpus-11-tools
        run: python3 tools/check_docs.py

      - name: Validate product-research boundaries
        working-directory: corpus-11-tools
        run: python3 tools/check_boundaries.py

      - name: Run all Python tests
        run: pytest -q

      - name: Run all Node test modules
        shell: bash
        run: |
          mapfile -d '' tests < <(find corpus-11-tools research -type f \( -name '*.test.mjs' -o -name '*.test.js' -o -name 'test-*.mjs' -o -name 'test-*.js' \) -print0)
          if (( ${#tests[@]} == 0 )); then
            echo 'No Node test modules found'
          else
            printf 'Running %d Node test modules\n' "${#tests[@]}"
            node --test "${tests[@]}"
          fi

      - name: Validate tracked JSON and JSONL
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(
              ['git', 'ls-files', '*.json', '*.jsonl'], text=True
          ).splitlines()
          checked = 0
          for raw in paths:
              path = Path(raw)
              if path.suffix == '.json':
                  json.loads(path.read_text(encoding='utf-8'))
                  checked += 1
              else:
                  for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      if line.strip():
                          try:
                              json.loads(line)
                          except Exception as exc:
                              raise RuntimeError(f'{path}:{line_no}: {exc}') from exc
                  checked += 1
          print(f'Validated {checked} tracked JSON/JSONL files')
          PY

      - name: Check whitespace and patch integrity
        run: git diff --check f8e3fe522aea9e437cb07482f02317822e02c8ad...HEAD

      - name: Record reception head
        run: |
          echo "Validated commit: $(git rev-parse HEAD)"
          git status --short
