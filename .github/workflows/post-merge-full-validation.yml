name: Total repository validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_HOME: ${{ runner.temp }}/corpus-codex-home

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.11'

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false

      - name: Install pinned validation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pytest==8.4.1 iniconfig==2.3.0 packaging==26.3 pluggy==1.6.0 pygments==2.21.0
          npm install --global @openai/codex@0.137.0
          python --version
          python -m pip --version
          node --version
          npm --version
          pytest --version
          codex --version

      - name: Validate package
        working-directory: corpus-11-tools
        run: python3 tools/validate_package.py

      - name: Validate graph
        working-directory: corpus-11-tools
        run: python3 tools/check_graph.py

      - name: Validate documentation
        working-directory: corpus-11-tools
        run: python3 tools/check_docs.py

      - name: Validate product-research boundaries
        working-directory: corpus-11-tools
        run: python3 tools/check_boundaries.py

      - name: Validate source and archive integrity
        working-directory: corpus-11-tools
        run: python3 tools/check_integrity.py

      - name: Validate release identity and tag ancestry
        working-directory: corpus-11-tools
        run: python3 tools/check_release_identity.py

      - name: Validate eval contracts and coverage
        working-directory: corpus-11-tools
        run: python3 tools/check_evals.py

      - name: Validate exact test inventory and its guard
        working-directory: corpus-11-tools
        run: python3 tools/check_test_inventory.py --self-test

      - name: Adversarially test the validators
        working-directory: corpus-11-tools
        run: python3 tools/test_validation_guards.py

      - name: Clean-room Codex plugin installation
        shell: bash
        run: |
          rm -rf "$CODEX_HOME"
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add .
          codex plugin add corpus-11-tools@corpus-11-local
          codex plugin list > "$RUNNER_TEMP/corpus-plugin-list.txt"
          cat "$RUNNER_TEMP/corpus-plugin-list.txt"
          grep -F 'corpus-11-tools' "$RUNNER_TEMP/corpus-plugin-list.txt"

      - name: Run Python test discovery
        run: PYTHONPATH=corpus-11-tools/labs/python pytest -q

      - name: Run Node test discovery outside archived food site
        shell: bash
        run: |
          mapfile -d '' tests < <(find corpus-11-tools research \
            -path 'research/completed/food-access-paris/site' -prune -o \
            -type f \( -name '*.test.mjs' -o -name '*.test.js' -o -name 'test-*.mjs' -o -name 'test-*.js' \) -print0)
          if (( ${#tests[@]} == 0 )); then
            echo 'FAIL: no Node test modules found' >&2
            exit 1
          fi
          printf 'Running %d Node test modules\n' "${#tests[@]}"
          node --test "${tests[@]}"

      - name: Run CCT integration controls
        run: PYTHONPATH=corpus-11-tools/labs/python python3 research/active/cct/executable/run_all.py

      - name: Run completed food-access prototype tests
        working-directory: research/completed/food-access-paris/site
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Validate tracked JSON and JSONL
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(
              ['git', 'ls-files', '*.json', '*.jsonl'], text=True
          ).splitlines()
          checked = 0
          for raw in paths:
              path = Path(raw)
              if path.suffix == '.json':
                  json.loads(path.read_text(encoding='utf-8'))
              else:
                  for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      if line.strip():
                          try:
                              json.loads(line)
                          except Exception as exc:
                              raise RuntimeError(f'{path}:{line_no}: {exc}') from exc
              checked += 1
          print(f'Validated {checked} tracked JSON/JSONL files')
          PY

      - name: Run behavioral routing and order-robustness evals
        working-directory: corpus-11-tools
        run: python3 tools/run_behavioral_evals.py

      - name: Check patch whitespace integrity
        run: git diff --check origin/main...HEAD

      - name: Record validated commit and environment
        shell: bash
        run: |
          echo "Validated commit: $(git rev-parse HEAD)"
          echo "Runner: ubuntu-24.04"
          python --version
          python -m pip --version
          node --version
          npm --version
          pytest --version
          codex --version
