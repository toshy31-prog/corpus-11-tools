name: Post-merge full validation

on:
  push:
    branches:
      - agent/post-merge-full-validation
    paths-ignore:
      - post-merge-validation-report.md

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run reception matrix and persist attestation
        shell: bash
        run: |
          set -u -o pipefail
          BASE=f8e3fe522aea9e437cb07482f02317822e02c8ad
          REPORT=post-merge-validation-report.md
          FAILED=0

          cat > "$REPORT" <<EOF
          # Post-merge validation report

          - base: \`$BASE\`
          - validated head: \`$(git rev-parse HEAD)\`
          - runner: GitHub Actions / \`ubuntu-latest\`
          - generated UTC: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`

          EOF

          run_check() {
            local name="$1"
            shift
            local logfile
            logfile="$(mktemp)"
            printf '## %s\n\n' "$name" >> "$REPORT"
            set +e
            "$@" 2>&1 | tee "$logfile"
            local code=${PIPESTATUS[0]}
            set -e
            printf -- '- exit code: `%s`\n' "$code" >> "$REPORT"
            if (( code == 0 )); then
              printf -- '- verdict: **PASS**\n\n' >> "$REPORT"
            else
              FAILED=1
              printf -- '- verdict: **FAIL**\n\n```text\n' >> "$REPORT"
              tail -n 40 "$logfile" >> "$REPORT"
              printf '\n```\n\n' >> "$REPORT"
            fi
            rm -f "$logfile"
          }

          python -m pip install --disable-pip-version-check pytest

          run_check 'Package validator' bash -lc 'cd corpus-11-tools && python3 tools/validate_package.py'
          run_check 'Graph validator' bash -lc 'cd corpus-11-tools && python3 tools/check_graph.py'
          run_check 'Documentation validator' bash -lc 'cd corpus-11-tools && python3 tools/check_docs.py'
          run_check 'Product/research boundary validator' bash -lc 'cd corpus-11-tools && python3 tools/check_boundaries.py'

          run_check 'Python test discovery' bash -lc 'pytest -q'

          run_check 'Node test discovery' bash -lc '
            mapfile -d "" tests < <(find corpus-11-tools research -type f \( -name "*.test.mjs" -o -name "*.test.js" -o -name "test-*.mjs" -o -name "test-*.js" \) -print0)
            if (( ${#tests[@]} == 0 )); then
              echo "No Node test modules found"
            else
              printf "Running %d Node test modules\\n" "${#tests[@]}"
              node --test "${tests[@]}"
            fi
          '

          run_check 'CCT integration controls' bash -lc 'python3 research/active/cct/executable/run_all.py'

          run_check 'Completed food-access prototype' bash -lc '
            cd research/completed/food-access-paris/site
            npm ci --ignore-scripts
            npm test
          '

          run_check 'Tracked JSON and JSONL integrity' bash -lc '
            python3 - <<"PY"
          import json
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(["git", "ls-files", "*.json", "*.jsonl"], text=True).splitlines()
          checked = 0
          for raw in paths:
              path = Path(raw)
              if path.suffix == ".json":
                  json.loads(path.read_text(encoding="utf-8"))
              else:
                  for line_no, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                      if line.strip():
                          try:
                              json.loads(line)
                          except Exception as exc:
                              raise RuntimeError(f"{path}:{line_no}: {exc}") from exc
              checked += 1
          print(f"Validated {checked} tracked JSON/JSONL files")
          PY
          '

          run_check 'Patch whitespace integrity' git diff --check "$BASE...HEAD"

          if (( FAILED == 0 )); then
            printf '## Final verdict\n\n**PASS — integral post-merge reception completed.**\n' >> "$REPORT"
          else
            printf '## Final verdict\n\n**FAIL — at least one reception control failed.**\n' >> "$REPORT"
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT"
          if ! git diff --cached --quiet; then
            git commit -m 'Record post-merge validation attestation'
            git push origin HEAD:agent/post-merge-full-validation
          fi

          exit "$FAILED"
