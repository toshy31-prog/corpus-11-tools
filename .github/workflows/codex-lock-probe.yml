name: Codex lock probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Generate candidate Codex lockfile
        working-directory: corpus-11-tools/tools/codex-cli-lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Prove candidate lock environment
        working-directory: corpus-11-tools/tools/codex-cli-lock
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          ./node_modules/.bin/codex --version | grep -F 'codex-cli 0.137.0'
      - name: Export candidate lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-cli-lockfile
          path: corpus-11-tools/tools/codex-cli-lock/package-lock.json
          if-no-files-found: error
          retention-days: 1
