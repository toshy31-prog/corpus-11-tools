name: Food security probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Build candidate secure graph
        working-directory: research/completed/food-access-paris/site
        run: |
          npm pkg set \
            overrides.esbuild=0.28.2 \
            overrides.brace-expansion=5.0.9 \
            overrides.fast-uri=3.1.5 \
            overrides.js-yaml=4.3.1 \
            overrides.nanoid=3.3.18 \
            overrides.postcss=8.5.26 \
            overrides.sharp=0.35.3 \
            overrides.undici=7.29.0 \
            overrides.ws=8.21.3 \
            'overrides.@babel/core'=7.29.7
          npm install --ignore-scripts --save-exact \
            react@19.2.8 react-dom@19.2.8
          npm install --ignore-scripts --save-dev --save-exact \
            react-server-dom-webpack@19.2.8 \
            @cloudflare/vite-plugin@1.53.1 \
            @vitejs/plugin-rsc@0.5.34 \
            vinext@1.0.0-beta.8 \
            vite@8.2.2 \
            wrangler@4.125.0
      - name: Audit candidate graph
        working-directory: research/completed/food-access-paris/site
        run: npm audit --audit-level=high
      - name: Smoke-test migration tooling
        working-directory: research/completed/food-access-paris/site
        run: npx --no-install drizzle-kit --version
      - name: Lint candidate graph
        working-directory: research/completed/food-access-paris/site
        run: npm run lint
      - name: Test candidate graph
        working-directory: research/completed/food-access-paris/site
        run: npm test
      - name: Show candidate manifests
        if: always()
        working-directory: research/completed/food-access-paris/site
        run: |
          git diff -- package.json
          npm ls --depth=0 || true
